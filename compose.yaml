services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-klassapp}
      POSTGRES_USER: ${POSTGRES_USER:-klassapp_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-use}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-klassapp_dev} -d ${POSTGRES_DB:-klassapp}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
